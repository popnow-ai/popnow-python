[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "popnow"
dynamic = ["version"]
description = "Typed Python SDK for the PopNow API: AI video, image, music and speech generation (Kling, Seedance, Wan, Nano Banana, GPT Image, Suno and more)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "PopNow" }]
keywords = [
  "popnow",
  "ai-video-generator",
  "text-to-video",
  "image-to-video",
  "text-to-image",
  "ai-image-generator",
  "text-to-speech",
  "ai-music",
  "generative-ai",
  "api-client",
  "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "respx>=0.21", "anyio>=3.7"]

[project.urls]
Homepage = "https://popnow.ai"
Documentation = "https://popnow.ai/docs"
"API reference" = "https://popnow.ai/docs/openapi.yaml"
Source = "https://github.com/popnow-ai/popnow-python"
Issues = "https://github.com/popnow-ai/popnow-python/issues"
Changelog = "https://github.com/popnow-ai/popnow-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/popnow/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/popnow"]

[tool.hatch.build.targets.sdist]
include = ["src/popnow", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
